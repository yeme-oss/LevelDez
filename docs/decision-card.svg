<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">TL;DR: why LevelDez uses Microsoft Decision-1</title>
  <desc id="d">Decision-1 returns calibrated yes/no probabilities, batched in one cheap call. It shines at taste-style judgments about rooms; deterministic code handles geometry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2f73"/>
      <stop offset="0.6" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#2bb6ee"/>
    </linearGradient>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00264d" flood-opacity=".35"/></filter>
  </defs>
  <style>
    text{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#fff}
    .k{font-size:20px;letter-spacing:.16em;font-weight:700;opacity:.9}
    .h{font-size:44px;font-weight:700}
    .s{font-size:23px;opacity:.95}
    .big{font-size:48px;font-weight:800}
    .ct{font-size:26px;font-weight:700}
    .cb{font-size:21px;opacity:.96}
    .f{font-size:22px;font-weight:600}
    .tag{font-size:17px;letter-spacing:.12em;font-weight:600;opacity:.85}
  </style>
  <rect x="10" y="10" width="1180" height="620" rx="28" fill="url(#bg)" filter="url(#sh)"/>

  <text class="k" x="48" y="62">TL;DR  ·  WHY MICROSOFT DECISION-1</text>
  <text class="h" x="48" y="118">A tiny yes/no brain for a thousand small design calls</text>
  <text class="s" x="48" y="158">Interior design is mostly taste-sized questions. Decision-1 answers them with numbers.</text>

  <!-- 2x2 tiles -->
  <g fill="#fff" fill-opacity=".15" stroke="#fff" stroke-opacity=".4" stroke-width="1.5">
    <rect x="48" y="186" width="548" height="170" rx="18"/>
    <rect x="604" y="186" width="548" height="170" rx="18"/>
    <rect x="48" y="368" width="548" height="170" rx="18"/>
    <rect x="604" y="368" width="548" height="170" rx="18"/>
  </g>

  <text class="big" x="72" y="244">P(yes)</text>
  <text class="ct" x="72" y="282">Calibrated, not chatty</text>
  <text class="cb" x="72" y="314">Every answer is a probability you can</text>
  <text class="cb" x="72" y="340">threshold or rank. Nothing to parse.</text>

  <text class="big" x="628" y="244">1 call</text>
  <text class="ct" x="628" y="282">Batched and cheap</text>
  <text class="cb" x="628" y="314">Dozens of questions about a room at once.</text>
  <text class="cb" x="628" y="340">A full autopilot run is ~0.1 cent.</text>

  <text class="big" x="72" y="426">Taste</text>
  <text class="ct" x="72" y="464">Where it shines</text>
  <text class="cb" x="72" y="496">"Needs a rug?"  "Too cluttered?"</text>
  <text class="cb" x="72" y="522">"Does a crypt want this theme?"</text>

  <text class="big" x="628" y="426">Code</text>
  <text class="ct" x="628" y="464">Does the geometry</text>
  <text class="cb" x="628" y="496">The model decides WHAT. Code decides</text>
  <text class="cb" x="628" y="522">WHERE: no clipping, undo always works.</text>

  <text class="f" x="48" y="584">Cheap enough to ask constantly. Structured enough to trust.</text>
  <text class="tag" x="48" y="614">LEVELDEZ  ·  microsoft/microsoft-decision-1 via OpenRouter</text>
</svg>
